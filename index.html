<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>haru — Sweet Tweet</title>
<style>
  body {
    margin:0;
    background:#05060a;
    color:#f5f5f5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
  }

  .wrapper {
    text-align:center;
  }

  .title {
    letter-spacing:0.2em;
    font-size:14px;
    text-transform:uppercase;
    opacity:0.7;
  }

  .record-area {
    margin-top:40px;
    position:relative;
  }

  .record {
    width:260px;
    height:260px;
    border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%, #222 0, #000 40%, #000 60%, #111 100%);
    box-shadow:0 0 40px rgba(0,0,0,0.8);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    animation:spin 10s linear infinite;
    animation-play-state:paused;
  }

  .label {
    width:90px;
    height:90px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #ffb7e6 0, #ff6fb3 40%, #c83c8a 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
  }

  .needle {
    position:absolute;
    width:140px;
    height:4px;
    background:#ccc;
    top:40px;
    right:-40px;
    transform-origin:left center;
    transform:rotate(18deg);
    border-radius:2px;
    box-shadow:0 0 10px rgba(255,255,255,0.2);
  }

  .needle::after {
    content:"";
    position:absolute;
    right:-8px;
    top:-4px;
    width:16px;
    height:12px;
    border-radius:3px;
    background:#ddd;
  }

  .status {
    margin-top:30px;
    font-size:14px;
    opacity:0.8;
  }

  .hint {
    margin-top:8px;
    font-size:12px;
    opacity:0.5;
  }

  .insta {
    position:fixed;
    right:24px;
    bottom:20px;
    font-size:13px;
    text-decoration:none;
    color:#f5f5f5;
    opacity:0.7;
    border:1px solid rgba(245,245,245,0.3);
    padding:6px 10px;
    border-radius:999px;
    backdrop-filter:blur(6px);
  }

  .insta:hover {
    opacity:1;
    border-color:#ff9fd4;
  }

  @keyframes spin {
    from { transform:rotate(0deg); }
    to   { transform:rotate(360deg); }
  }
</style>
</head>
<body>

<div class="wrapper">
  <div class="title">haru._.uwu</div>

  <div class="record-area">
    <div class="record" id="record">
      <div class="label">
        SWEET<br>TWEET
      </div>
    </div>
    <div class="needle" id="needle"></div>
  </div>

  <div class="status" id="status">
    click the record to play “Sweet Tweet”
  </div>
  <div class="hint">
    再生 / 一時停止はレコードをクリック
  </div>
</div>

<a class="insta" href="https://www.instagram.com/haru._.uwu" target="_blank">
  Instagram @haru._.uwu
</a>

<audio id="player" src="sweet_tweet.mp3"></audio>

<script>
  const record = document.getElementById('record');
  const player = document.getElementById('player');
  const status = document.getElementById('status');
  const needle = document.getElementById('needle');

  let playing = false;

  record.addEventListener('click', () => {
    if (!playing) {
      player.play();
      record.style.animationPlayState = 'running';
      needle.style.transform = 'rotate(8deg)';
      status.textContent = 'Now Playing: Sweet Tweet';
      playing = true;
    } else {
      player.pause();
      record.style.animationPlayState = 'paused';
      needle.style.transform = 'rotate(18deg)';
      status.textContent = 'Paused: Sweet Tweet';
      playing = false;
    }
  });
</script>

</body>
</html>
