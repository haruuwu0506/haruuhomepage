<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>haru — Sweet Tweet</title>
<style>
  body {
    margin:0;
    background:linear-gradient(160deg,#0a0a0f,#2b0b1f,#ffb7e6);
    color:#fff;
    font-family:"Segoe UI",sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    overflow:hidden;
  }

  .title {
    font-size:16px;
    letter-spacing:0.15em;
    opacity:0.7;
    text-transform:uppercase;
  }

  .record {
    width:280px;
    height:280px;
    border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%, #222 0, #000 40%, #000 60%, #111 100%);
    box-shadow:0 0 40px rgba(255,150,200,0.3);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    animation:spin 9s linear infinite;
    animation-play-state:paused;
  }

  .label {
    width:90px;
    height:90px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #ffb7e6 0, #ff6fb3 40%, #c83c8a 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
  }

  @keyframes spin {
    from {transform:rotate(0deg);}
    to {transform:rotate(360deg);}
  }

  .status {
    margin-top:30px;
    font-size:14px;
    opacity:0.8;
  }

  .insta {
    position:fixed;
    right:24px;
    bottom:20px;
    font-size:13px;
    text-decoration:none;
    color:#fff;
    opacity:0.7;
    border:1px solid rgba(255,255,255,0.3);
    padding:6px 10px;
    border-radius:999px;
    backdrop-filter:blur(6px);
  }

  .insta:hover {
    opacity:1;
    border-color:#ff9fd4;
  }
</style>
</head>
<body>

<div class="title">haru._.uwu</div>

<div class="record" id="record">
  <div class="label">Sweet<br>Tweet</div>
</div>

<div class="status" id="status">click the record to play</div>

<a class="insta" href="https://www.instagram.com/haru._.uwu" target="_blank">
  Instagram @haru._.uwu
</a>

<audio id="player" src="sweet_tweet.mp3"></audio>

<script>
  const record = document.getElementById('record');
  const player = document.getElementById('player');
  const status = document.getElementById('status');
  let playing = false;

  record.addEventListener('click', () => {
    if (!playing) {
      player.play();
      record.style.animationPlayState = 'running';
      status.textContent = 'Now Playing: Sweet Tweet';
      playing = true;
    } else {
      player.pause();
      record.style.animationPlayState = 'paused';
      status.textContent = 'Paused: Sweet Tweet';
      playing = false;
    }
  });
</script>

</body>
</html>
